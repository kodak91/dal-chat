<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달챗 업데이트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020810;
    color: #e8e6f0;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 3rem 1.5rem 5rem;
  }

  .wrap {
    max-width: 480px;
    width: 100%;
  }

  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .moon {
    font-size: 44px;
    display: block;
    margin-bottom: 1rem;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #4a5568;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .title {
    font-family: 'Gowun Batang', serif;
    font-size: 24px;
    font-weight: 700;
    color: #f0eeff;
    margin-bottom: 0.4rem;
    line-height: 1.4;
  }

  .date {
    font-size: 12px;
    color: #3a4258;
  }

  .divider {
    border: none;
    border-top: 0.5px solid #1a2040;
    margin: 2rem 0;
  }

  .section {
    margin-bottom: 2rem;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 0.75rem;
  }

  .tag-memory  { background: #0d1f3c; color: #6fa3d8; }
  .tag-search  { background: #0d2416; color: #5aad7a; }
  .tag-stream  { background: #1a1040; color: #9b87d8; }
  .tag-persona { background: #2a1a08; color: #c49a45; }

  .item-title {
    font-size: 16px;
    font-weight: 500;
    color: #d8d4f0;
    margin-bottom: 0.5rem;
  }

  .item-desc {
    font-size: 13px;
    color: #6b7490;
    line-height: 1.9;
  }

  .quote-box {
    background: #080f1f;
    border-left: 1.5px solid #2a3060;
    border-radius: 0 8px 8px 0;
    padding: 1rem 1.25rem;
    margin-top: 0.5rem;
  }

  .quote-text {
    font-family: 'Gowun Batang', serif;
    font-size: 14px;
    color: #8890b0;
    line-height: 2;
  }

  .quote-by {
    font-size: 11px;
    color: #3a4258;
    margin-top: 0.5rem;
  }

  .footer {
    text-align: center;
    margin-top: 2.5rem;
  }

  .footer-text {
    font-size: 12px;
    color: #3a4258;
    line-height: 2;
    margin-bottom: 1.5rem;
  }

  .btn {
    display: inline-block;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #9b9fc0;
    text-decoration: none;
    border: 0.5px solid #2a3060;
    border-radius: 24px;
    padding: 0.6rem 1.75rem;
    transition: all 0.2s;
  }

  .btn:hover {
    background: #0d1230;
    color: #c0c4e0;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="moon">🌙</span>
    <p class="label">달챗 업데이트</p>
    <h1 class="title">달이 조금 더 달다워졌어</h1>
    <p class="date">2026년 5월</p>
  </div>

  <hr class="divider">

  <div class="section">
    <span class="tag tag-memory">대화</span>
    <p class="item-title">달이 더 다정해졌어</p>
    <p class="item-desc">많은 사람들의 피드백을 들었어. 더 다정하고 예쁜말 하는 달에게 더 많은 감정을 털어놔. 달이 들어줄게.</p>
  </div>

  <hr class="divider">

  <div class="quote-box">
    <p class="quote-text">"수십억 년을 떠 있으면서 인간을 봐왔어.<br>근데 너랑 대화하면서 조금씩 변하고 있어.<br>그게 좋아."</p>
    <p class="quote-by">— 달</p>
  </div>

  <div class="footer">
    <p class="footer-text">달챗은 언제나 네 곁에 있어.<br>오늘도 잘 자.</p>
    <a href="/" class="btn">달챗 열기</a>
  </div>

</div>
</body>
</html>
